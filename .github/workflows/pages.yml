name: Deploy app to GitHub Pages

# Publishes only the rps7-paley-ca/ app to Pages (served at the project root,
# https://kai-denrei.github.io/n7-automata/). The .deban vault and other repo
# files are not part of the deployed artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: rps7-paley-ca
      - id: deployment
        uses: actions/deploy-pages@v4
